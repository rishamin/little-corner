<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Check-in ♡ Little One's Haven</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sensory.css">
</head>

<body class="sensory-page">

  <main class="sensory-container">

    <!-- START SCREEN -->

    <section class="sensory-screen start-screen" id="start-screen">

      <div class="sensory-heading">
        <h1>Let's check in, sweetheart.</h1>

        <p>
          Let's figure out what might help
          you feel a little better.
        </p>
      </div>

      <div class="mode-card">

        <h2>How would you like to check in?</h2>

        <button
          class="mode-button"
          type="button"
          data-mode="quick"
        >
          <strong>Quick check</strong>
          <span>
            Just a few small questions about
            what you need right now.
          </span>
        </button>

        <button
          class="mode-button"
          type="button"
          data-mode="slow"
        >
          <strong>Slower check</strong>
          <span>
            A more complete check-in,
            one little step at a time.
          </span>
        </button>

      </div>

    </section>


    <!-- QUESTION SCREEN -->

    <section
      class="sensory-screen question-screen"
      id="question-screen"
      hidden
    >

      <div class="question-progress">

        <div
          class="progress-track"
          role="progressbar"
          aria-label="Question progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="progress-track"
        >
          <div
            class="progress-fill"
            id="progress-fill"
          ></div>
        </div>

      </div>

      <div class="question-card">

        <p
          class="question-text"
          id="question-text"
          aria-live="polite"
        ></p>

        <div
          class="answer-options"
          id="answer-options"
        ></div>

      </div>

      <div class="question-navigation">

        <button
          class="text-button"
          type="button"
          id="back-button"
        >
          ← Back
        </button>

        <button
          class="text-button"
          type="button"
          id="skip-button"
        >
          Skip
        </button>

      </div>

      <button
        class="finish-early-button"
        type="button"
        id="finish-early-button"
      >
        Show me what might help
      </button>

    </section>


    <!-- RESULTS SCREEN -->

    <section
      class="sensory-screen results-screen"
      id="results-screen"
      hidden
    >

      <div class="sensory-heading">
        <h1>Here are a few little things.</h1>

        <p>
          You don't have to do everything.
          Just take what feels helpful.
        </p>
      </div>

      <div
        class="results-list"
        id="results-list"
      ></div>

      <button
        class="more-button"
        type="button"
        id="more-button"
        hidden
      >
        More small things
      </button>

      <div
        class="more-results"
        id="more-results"
        hidden
      ></div>

      <div class="extra-tools">

        <button
          class="soft-action-button"
          type="button"
          id="breathe-button"
        >
          Breathe with me ♡
        </button>

        <button
          class="soft-action-button"
          type="button"
          id="pause-button"
        >
          Pause the world
        </button>

      </div>

      <div
        class="breathing-panel"
        id="breathing-panel"
        hidden
      >
        <div class="breathing-circle" id="breathing-circle"></div>

        <p id="breathing-text" aria-live="polite">
          Breathe in slowly…
        </p>

        <button
          class="text-button"
          type="button"
          id="stop-breathing-button"
        >
          Stop
        </button>
      </div>

      <button
        class="restart-button"
        type="button"
        id="restart-button"
      >
        Start over
      </button>

    </section>

  </main>


  <!-- FOOTER -->

  <footer class="sensory-footer">
    <a href="index.html">Back to your haven ♡</a>
  </footer>


  <script src="sensory.js"></script>

</body>
</html>
